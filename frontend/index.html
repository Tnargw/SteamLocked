<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamLocked</title>
  <meta name="description" content="An achievement challenge for any Steam game: roll a task, complete it, unlock the next.">
  <meta name="theme-color" content="#66c0f4">

  <!-- Inline SVG, so the icon costs no extra request. The star is drawn large
       relative to the lock body on purpose: at the proportions used elsewhere in
       the app it rasterises to an indistinct blur at 16px. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2366c0f4'/%3E%3Cpath d='M11.8 13V10.6a4.2 4.2 0 0 1 8.4 0V13' fill='none' stroke='%2306121d' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M5 16.1a3.6 3.6 0 0 1 3.6 -3.6h14.8a3.6 3.6 0 0 1 3.6 3.6v7.8a3.6 3.6 0 0 1 -3.6 3.6h-14.8a3.6 3.6 0 0 1 -3.6 -3.6ZM16.00 14.20L17.47 17.98L21.52 18.21L18.38 20.77L19.41 24.69L16.00 22.50L12.59 24.69L13.62 20.77L10.48 18.21L14.53 17.98Z' fill='%2306121d' fill-rule='evenodd'/%3E%3C/svg%3E">
  <!-- iOS ignores SVG for apple-touch-icon, and masks the corners itself, so this
       one is a full-bleed 180px PNG rather than the rounded inline icon above. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-lock" aria-hidden="true">&#128274;</span>
        <span class="brand-text">Steam<strong>Locked</strong></span>
      </a>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div id="account" class="account"></div>
    </div>
  </header>

  <main id="main" class="wrap">
    <!-- Views are swapped in here by js/app.js -->
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        Not affiliated with Valve. Game data from the Steam Web API.
      </p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
