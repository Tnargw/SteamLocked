<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamLocked</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>SteamLocked</h1>

  <form id="lookup">
    <label>
      SteamID64
      <input id="steamid" name="steamid" inputmode="numeric" pattern="\d{17}"
             placeholder="76561197960287930" required>
    </label>
    <button type="submit">Load games</button>
  </form>

  <p id="status"></p>
  <ul id="games"></ul>

  <script src="js/app.js"></script>
</body>
</html>
