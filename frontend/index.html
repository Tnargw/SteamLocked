<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamLocked</title>
  <meta name="description" content="A Taskman-style challenge tracker for any Steam game: roll a task, complete it, unlock the next.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-lock" aria-hidden="true">&#128274;</span>
        <span class="brand-text">Steam<strong>Locked</strong></span>
      </a>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div id="account" class="account"></div>
    </div>
  </header>

  <main id="main" class="wrap">
    <!-- Views are swapped in here by js/app.js -->
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        Not affiliated with Valve. Game data from the Steam Web API.
      </p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
