<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SteamLocked</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --accent: #58a6ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 0.5rem; }
    p { font-size: 1.125rem; opacity: 0.8; max-width: 40ch; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>SteamLocked</h1>
  <p>A plain HTML page deployed with GitHub Pages.</p>
</body>
</html>
